[project]
name = "bot-tickets"
version = "0.1.0"
description = "Telegram bot para procesar tickets de operarios con OCR y exportar a Excel"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "opencv-python-headless>=4.10.0",
    "openai>=1.50.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
